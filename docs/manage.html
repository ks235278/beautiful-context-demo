<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f1">
<title>運営者メニュー｜Beautiful Context</title>
<!-- この端末は運営の人のもの：読者の画面のメニューにも「運営者メニュー」を出す（app.js が localStorage の bc-operator を見る） -->
<script>try { localStorage.setItem('bc-operator', '1'); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest?v=175">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* 運営者の道具。読者の画面とは別の、明るく落ち着いた作業台。
     見た目はエディター（前田先生の設計）と揃えている。
     色は紙・墨・金（editorial-ink, 2026.10.27）。値は app.css と同じ（ここは app.css を読まない）。
     上の帯は紺のまま：ホーム画面から開くと時計が白なので、紙の帯にすると時計が消える */
  :root{
    --canvas:#faf7f1;       /* 作業台の紙（app.css の --paper） */
    --paper:#fdfbf7;        /* 札・欄（app.css の --paper-card） */
    --ink:#06142b; --ink-2:#2a3548; --muted:#5b626d;
    --line:#e0d6c5;         /* 札の罫（app.css の --hair） */
    --rule-p:#d1ccc3; --rule-field:#b9bbbf; --rule-gold-soft:#d7b37a;
    --field:#fcfaf6; --tab-off:#f3f0ea; --placeholder:#6d717c;
    --nav:#0a1f3a; --navy:#0a1f3a;
    /* 金。線と点だけ。紙の上の小さな文字は --gold-ink、白い字をのせるのは --gold-btn（4.51:1）。橙は ReMixIt! だけの色なので、ここでは使わない。
       紺の帯の上の金は --gold-lite（字は紺、8.6:1。エディターの「公開する」と同じ） */
    --gold:#a97717; --gold-ink:#8a5f10; --gold-btn:#9c6e1c; --gold-wash:#f7f2e7; --gold-lite:#efb02f;
    /* 状態：公開（緑）・非公開（灰紺）・一時非表示（赤） */
    --green:#15703a; --red:#b23a2e; --blue:#464e5e;
    --veil:var(--canvas);
  }
  *{box-sizing:border-box}
  html{background:var(--canvas)}
  body{margin:0;overflow-x:clip;color:var(--ink);background:var(--canvas);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.55}
  button,input,select,textarea{font:inherit;color:inherit}
  ::placeholder{color:var(--placeholder)}
  a{color:inherit}

  /* 上の帯は見本（編集部ダッシュボード）どおり紙の地：明朝の大きな題・右に淡い墨の山。以前は紺の帯（2026.11.03 から紙） */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:var(--canvas) url(img/deco/mist.png) right 220px top 0/auto 100% no-repeat;color:var(--navy);
    box-shadow:inset 0 -1px 0 var(--line),0 1px 0 rgba(169,119,23,.25)}
  .top h1{margin:0;font:700 22px/1.25 "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;letter-spacing:.04em;white-space:nowrap}
  .top h1 small{display:block;margin-top:2px;color:var(--muted);font:400 11px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;letter-spacing:.06em}
  .top nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .top nav a{padding:7px 12px;border:1px solid rgba(10,31,58,.35);border-radius:18px;background:var(--canvas);text-decoration:none;font-size:12px;white-space:nowrap}
  /* 帯のいちばんのボタンは見本どおり紺に白い字（紙の帯の上） */
  .top nav a.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

  .shell{display:grid;grid-template-columns:210px 1fr;gap:24px;max-width:1240px;margin:0 auto;padding:24px 20px 80px}
  .tabs{position:sticky;top:84px;align-self:start;display:grid;gap:3px}
  .tabs a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;
    text-decoration:none;color:var(--muted);font-size:13.5px}
  .tabs a b{font-weight:700;color:var(--ink)}
  .tabs a span{font-size:11px;color:var(--muted)}
  /* 選んでいる見出し：淡い金の地と、左の金の線 */
  .tabs a.on{background:var(--gold-wash);box-shadow:inset 3px 0 0 var(--gold);border-radius:0 8px 8px 0}
  .tabs a.on b{color:var(--gold-ink)}
  .tabs .sep{height:1px;margin:8px 4px;background:var(--line)}

  main{min-width:0}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(90,70,30,.10)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .head .eyebrow{margin:0 0 4px;color:var(--gold-ink);font:700 11px/1.4 sans-serif;letter-spacing:.14em}
  .head h2{margin:0;color:var(--ink);font:700 24px/1.35 "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif}
  .head p.note{margin:6px 0 0;color:var(--muted);font-size:12px;max-width:52em}
  .body{padding:18px 22px 24px}
  .row-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .chip{padding:6px 12px;border:1px solid var(--rule-p);border-radius:16px;background:var(--paper);cursor:pointer;font-size:12px}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip b{font-weight:700;margin-left:4px}
  .search{flex:1;min-width:180px;max-width:320px;margin-left:auto;padding:8px 12px;border:1px solid var(--rule-field);border-radius:18px;background:var(--paper)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .stat{padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
  .stat small{display:block;color:var(--muted);font-size:11px}
  .stat b{color:var(--ink);font:700 24px/1.2 "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif}

  .list{display:grid;gap:10px}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper)}
  .item.dim{background:var(--tab-off)}
  .thumbs{display:flex;align-items:flex-end}
  .thumbs img,.thumbs span{width:46px;height:64px;object-fit:cover;border-radius:4px;display:grid;place-items:center;
    background:#e9e4d6;color:var(--navy);font:18px serif;box-shadow:0 2px 6px rgba(10,31,58,.18)}
  .thumbs :nth-child(2){width:32px;height:44px;margin-left:-12px;border:2px solid var(--paper)}
  .info{min-width:0}
  .info b{display:block;color:var(--ink);font:700 15px/1.45 "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif}
  .info .sub{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .info .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;color:var(--muted);font-size:11px}
  .ops{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
  .ops a,.ops button,.btn{padding:6px 11px;border:1px solid var(--rule-field);border-radius:16px;background:var(--paper);color:var(--navy);cursor:pointer;
    text-decoration:none;font-size:12px;white-space:nowrap}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.warn,.ops .warn{color:var(--red);border-color:#e7c3bd}
  select.status{padding:6px 28px 6px 10px;border:1px solid var(--rule-field);border-radius:16px;font-size:12px;font-weight:700;background:var(--paper)}
  /* 携帯の Safari は 16px 未満の入力欄に触れると画面を拡大し、横にずれたまま戻らない */
  @media (hover:none){select,input,textarea{font-size:16px !important}}
  /* 状態は札の色でも分ける（公開 5.2:1・非公開 6.8:1） */
  select.status.public{color:var(--green);background-color:#e0f0db;border-color:#b5d6ac}
  select.status.private{color:var(--blue);background-color:#e8e8e8;border-color:#c9c9c9}
  select.status.hidden{color:var(--red);border-color:#e7c3bd}
  .noteline{grid-column:2 / -1;display:flex;gap:8px;align-items:center}
  .noteline input{flex:1;padding:7px 10px;border:1px dashed #e0b4ad;border-radius:8px;background:#fffaf9;font-size:12px}
  /* 指で触る端末：字が 16px になると、状態の札（37）だけが隣のボタン（32.6）より高く、どちらも指には低かった。
     欄・札・色の欄は高さ 44 に。札と同じ行のボタンも 44 の丸にそろえる。チェックの欄は、文字ごと押せる行を 44 に */
  @media (hover:none){
    select,textarea,input:not([type=checkbox]):not([type=radio]){min-height:44px}
    select.status,.ops>a,.ops>button,.ops>label.btn{min-height:44px;border-radius:999px}
    .ops>a,.ops>button,.ops>label.btn{min-width:58px}   /* 二文字のボタンが丸い粒にならないよう（長いボタンの幅は変えない） */
    .ops>a,.ops>label.btn{display:inline-flex;align-items:center;justify-content:center}
    .toggle{min-height:44px}
  }

  .field{display:grid;gap:5px;margin-bottom:14px}
  .field label{font-size:12px;font-weight:700}
  .field small{color:var(--muted);font-size:11px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--rule-field);border-radius:6px;background:var(--field)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sw.on{box-shadow:0 0 0 2px var(--navy)}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .theme-opt{position:relative;display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper)}
  .theme-opt input{position:absolute;opacity:0}
  .theme-opt.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .theme-opt i{display:block;height:74px;border-radius:6px;background-size:40px 40px}
  /* 地の見本：墨の山（炭）と和紙（白）の絵 */
  .theme-opt i.charcoal{background:#071a30 url(img/ink-navy.jpg) center/cover;box-shadow:inset 0 0 0 1px var(--line)}
  .theme-opt i.white{background:#f8f4eb url(img/ink-paper.jpg) center/cover;box-shadow:inset 0 0 0 1px var(--line)}
  .theme-opt b{font-size:12.5px}
  .custom{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
  .preview{position:sticky;top:96px;display:grid;gap:8px;justify-items:center}
  .phone{width:300px;height:600px;border:10px solid #111;border-radius:40px;overflow:hidden;background:#111;box-shadow:0 20px 50px #0004}
  .phone iframe{width:390px;height:780px;border:0;transform:scale(.7179);transform-origin:0 0;display:block}
  .preview small{color:var(--muted);font-size:11px}

  .ad-edit{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);margin-bottom:12px}
  .ad-edit .pic{width:120px;aspect-ratio:5/7;border-radius:6px;background:#111 center/cover;display:grid;place-items:center;color:#fff8;font-size:11px}
  .ad-edit .field{margin-bottom:10px}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
  .toggle input{width:18px;height:18px;accent-color:var(--gold-btn)}

  table.feat{width:100%;border-collapse:collapse;font-size:12.5px}
  .feat th,.feat td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .feat th{font-size:11px;color:var(--muted);font-weight:700;background:var(--tab-off);position:sticky;top:0}
  .feat td:first-child{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .feat .grp td{background:var(--gold-wash);font-weight:700;color:var(--gold-ink);font-size:11px;letter-spacing:.08em}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .tag.ok{background:#e0f0db;color:var(--green)}
  .tag.part{background:#fbf0dc;color:#8a5c0c}
  .tag.prod{background:#ecebe7;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 14px;font-size:11.5px;color:var(--muted)}

  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
  .talk{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
  .talk.dim{background:var(--tab-off);color:var(--muted)}
  .talk header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11.5px;color:var(--muted)}
  .talk header b{color:var(--ink)}
  .talk p{margin:2px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
  .talk .ops{justify-content:flex-start}
  .danger{margin-top:22px;padding:14px;border:1px solid #efd0ca;border-radius:12px;background:#fdf6f4}
  .danger h3{margin:0 0 6px;font-size:13px;color:var(--red)}
  .toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    padding:9px 16px;border-radius:18px;background:rgba(10,31,58,.94);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.show{opacity:1}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr;padding:12px 12px 70px;gap:12px}
    .tabs{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:10;display:flex;overflow-x:auto;gap:6px;
      margin:0 -12px;padding:8px 12px;background:var(--canvas);scrollbar-width:none;box-shadow:0 1px 0 var(--rule-gold-soft)}
    .tabs::-webkit-scrollbar{display:none}
    /* 携帯の横並び：選んでいるものだけ紺の札。ほかは文字だけ */
    .tabs a{flex:0 0 auto;padding:7px 12px;border:1px solid transparent;border-radius:18px;background:transparent;color:var(--ink)}
    .tabs a.on{background:var(--navy);border-color:var(--navy);box-shadow:none;border-radius:18px}
    .tabs a.on b{color:#fff}
    .search{min-height:44px}
    .tabs a span,.tabs .sep{display:none}
    .top{padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;gap:10px;background-image:none}   /* 狭い画面では墨の山が題に掛かるので出さない */
    .top h1 small{display:none}
    .top nav a:not(.primary){display:none}
    .head{flex-direction:column;align-items:flex-start;padding:16px}
    .head h2{font-size:22px}
    .body{padding:14px 12px 18px}
    .item{grid-template-columns:auto 1fr;gap:10px}
    .ops{grid-column:1 / -1;justify-content:flex-start}
    .custom{grid-template-columns:1fr}
    .preview{position:static}
    .grid2{grid-template-columns:1fr}
    .ad-edit{grid-template-columns:84px 1fr}
    .ad-edit .pic{width:84px}
    .feat-wrap{overflow-x:auto}
    table.feat{min-width:620px}
  }
</style>
<link rel="stylesheet" href="fade.css?v=175">
</head>
<body>
  <header class="top">
    <h1>運営者メニュー<small id="brandName">Beautiful Context</small></h1>
    <nav>
      <a href="index.html">← UniverseIt!</a>
      <a class="primary" href="editor.html?new=1">＋ 新しいコンテクスト</a>
    </nav>
  </header>

  <div class="shell">
    <nav class="tabs" id="tabs" aria-label="管理メニュー"></nav>
    <main id="main"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=175"></script>
  <script src="js/seed.js?v=175"></script>
  <script src="js/sources.js?v=175"></script>
  <script src="js/backend.js?v=175"></script>
  <script src="js/store.js?v=175"></script>
  <script src="js/render.js?v=175"></script>
  <script src="js/manage.js?v=175"></script>
  <script src="js/transition.js?v=175"></script>
</body>
</html>
