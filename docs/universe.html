<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="UniverseIt! — 公開済みのコンテクストと作品の見出しがタグクラウド状に流れ続ける回遊画面。">
<title>Beautiful Context｜UniverseIt!</title>
<link rel="stylesheet" href="app.css">
<style>
  body{background:radial-gradient(circle at 50% 25%,#2a3038,#12161c 72%)}
  .screen{background:var(--charcoal)}
  .pcb{position:absolute;inset:0;opacity:.5}
  .menu{position:absolute;top:calc(8px + var(--top));right:8px;z-index:6;width:46px;height:46px;
        background:none;border:0;padding:15px 12px;cursor:pointer}
  .menu span{display:block;height:1.6px;background:#fff;border-radius:2px;margin-bottom:5px;opacity:.9}
  .head{position:absolute;top:calc(40px + var(--top));left:0;right:0;z-index:4;text-align:center;pointer-events:none}
  .head h1{margin:0;color:#fff;font:400 32px/1.1 "Hiragino Mincho ProN","Yu Mincho",serif}
  .head p{margin:6px 0 0;color:#aab6c6;font-size:10.5px;letter-spacing:.16em}
  .cloud{position:absolute;top:calc(118px + var(--top));left:0;right:0;bottom:var(--dock);z-index:3;
         overflow:hidden;display:flex;flex-direction:column;justify-content:space-evenly}
  .cloud::before,.cloud::after{content:"";position:absolute;left:0;right:0;height:26px;z-index:2;pointer-events:none}
  .cloud::before{top:0;background:linear-gradient(var(--charcoal),rgba(16,20,26,0))}
  .cloud::after{bottom:0;background:linear-gradient(rgba(16,20,26,0),var(--charcoal))}
  .row{display:flex;width:max-content;align-items:baseline;will-change:transform}
  .row.paused{animation-play-state:paused}
  @keyframes driftL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes driftR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  .tag{flex:0 0 auto;margin:0 9px;padding:2px 0;background:none;border:0;font-family:inherit;
       cursor:pointer;white-space:nowrap;line-height:1.5;transition:color .18s ease}
  .tag.ctx{color:#eef2f8}
  .tag.work{color:#9fb0c6}
  .tag .h{color:#6f8db4;margin-right:1px}
  .tag:hover,.tag:focus-visible{color:#ffd489;outline:none}
  .bottom{background:none;border:0;box-shadow:none;backdrop-filter:none;
          display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px}
  .count{text-align:center;color:#8fa0b6;font-size:9px;letter-spacing:.2em;margin-bottom:8px}
  .acts{display:flex;gap:8px;margin-bottom:16px}
  .b{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border:0;
     border-radius:7px;color:#fff;font-family:inherit;cursor:pointer;text-decoration:none}
  .b b{display:block;font-size:10.5px;font-weight:600;line-height:1.25}
  .b small{display:block;font-size:8.5px;opacity:.82;letter-spacing:.06em}
  .b.remix{background:var(--orange)}
  .b.uni{background:var(--navy)}
  .none{position:absolute;inset:auto 24px;top:46%;z-index:4;text-align:center;color:#aab6c6;
        font-size:12px;line-height:2}
  .sheet{position:absolute;inset:0;z-index:30;background:rgba(8,11,15,.96);display:none;
         flex-direction:column;padding:calc(58px + var(--top)) 20px calc(20px + env(safe-area-inset-bottom))}
  .sheet.open{display:flex}
  .sheet h2{margin:0 0 4px;color:#fff;font:600 13px/1.4 inherit;letter-spacing:.08em}
  .sheet p.hint{margin:0 0 16px;color:#8fa0b6;font-size:10.5px}
  .sheet ul{list-style:none;margin:0 0 16px;padding:0;overflow-y:auto;flex:1}
  .sheet li{border-bottom:1px solid rgba(255,255,255,.1)}
  .sheet li button{width:100%;padding:12px 2px;background:none;border:0;color:#e8edf4;
                   font-family:inherit;font-size:12.5px;text-align:left;cursor:pointer}
  .sheet li button small{display:block;margin-top:3px;color:#8fa0b6;font-size:10px}
  .sheet .row2{display:flex;gap:8px}
  .sheet .row2 button,.sheet .row2 a{flex:1;height:42px;display:grid;place-items:center;border-radius:7px;
    border:1px solid rgba(255,255,255,.28);background:none;color:#fff;font-family:inherit;font-size:11px;
    cursor:pointer;text-decoration:none}
  .sheet .row2 .fill{background:var(--orange);border-color:var(--orange)}
  .close{position:absolute;top:calc(8px + var(--top));right:8px;z-index:31;width:46px;height:46px;
         background:none;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer}
  @media (max-width:760px){ body{background:var(--charcoal)} }
</style>
</head>
<body>
<main class="stage">
  <div class="phone">
    <div class="screen">
      <svg class="pcb" viewBox="0 0 300 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="trace" width="75" height="75" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#2f6fb5" stroke-width="1.4" stroke-linecap="round">
              <path d="M0 18 H30 L44 32 H75"/><path d="M0 56 H18 L30 44 V8"/>
              <path d="M56 0 V26 L68 38 V75"/><path d="M8 75 V60 L22 46 H50"/><path d="M75 62 H60 L50 52"/>
            </g>
            <g fill="#2f6fb5">
              <circle cx="30" cy="30" r="2.6"/><circle cx="56" cy="26" r="2.2"/>
              <circle cx="18" cy="56" r="2.2"/><circle cx="50" cy="46" r="2.4"/>
              <rect x="60" y="6" width="9" height="9" rx="1.6"/><rect x="6" y="34" width="7" height="7" rx="1.4"/>
            </g>
          </pattern>
        </defs>
        <rect width="300" height="620" fill="#10141a"/><rect width="300" height="620" fill="url(#trace)"/>
      </svg>

      <button class="menu" type="button" aria-label="メニュー"><span></span><span></span><span></span></button>

      <div class="head">
        <h1>UniverseIt!</h1>
        <p>言葉から、つながりを辿る</p>
      </div>

      <div class="cloud" id="cloud"></div>

      <div class="sheet" id="sheet" role="dialog" aria-label="メニュー">
        <button class="close" id="close" type="button" aria-label="閉じる">×</button>
        <h2>公開中のコンテクスト</h2>
        <p class="hint">タップすると、そのページを開きます</p>
        <ul id="list"></ul>
        <div class="row2">
          <a class="fill" href="editor.html?new=1">新しく創る</a>
          <button type="button" id="reset">初期データに戻す</button>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="bottom">
        <div class="count" id="count"></div>
        <div class="acts">
          <a class="b remix" href="editor.html">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" aria-hidden="true">
              <circle cx="9" cy="12" r="5.4"/><circle cx="15" cy="12" r="5.4"/></svg>
            <span><b>つながりを創る</b><small>ReMixIt!</small></span>
          </a>
          <button class="b uni" type="button" id="reshuffle">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6a15 15 0 0 1 0 16.8M12 3.6a15 15 0 0 0 0 16.8"/></svg>
            <span><b>つながりを辿る</b><small>UniverseIt!</small></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script>
(() => {
  const S = window.BCStore;
  const cloud = document.getElementById('cloud');
  const toastEl = document.getElementById('toast');
  const SIZES = [12,13,14,16,18,20];
  const ROWS = 9;

  /* 見出しの母集団をストアから作る。すべて実在する公開ページに対応する。 */
  function pool(){
    const out = [];
    S.all().forEach(e => {
      out.push({ text: e.context.routeName, kind:'ctx', href:'page.html?context='+encodeURIComponent(e.context.slug) });
      const head = (e.context.headline||'').split('\n')[0].replace(/[、。]$/,'');
      if (head) out.push({ text: head, kind:'ctx', href:'page.html?context='+encodeURIComponent(e.context.slug) });
    });
    S.works().forEach(w => {
      out.push({ text: w.work.title.replace(/[『』]/g,''), kind:'work', href:'page.html?work='+encodeURIComponent(w.slug) });
    });
    return out;
  }

  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1500);
  }

  const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

  function makeTag(item, i, r){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tag ' + item.kind;
    b.style.fontSize = SIZES[(i+r) % SIZES.length] + (item.kind==='ctx' ? 2 : 0) + 'px';
    if (item.kind === 'work'){
      const h = document.createElement('span'); h.className='h'; h.textContent='#'; b.appendChild(h);
    }
    b.appendChild(document.createTextNode(item.text));
    b.dataset.href = item.href;
    return b;
  }

  function render(){
    const items = pool();
    const count = document.getElementById('count');
    cloud.textContent = '';

    if (!items.length){
      cloud.innerHTML = '<p class="none">まだ公開されたページがありません。<br>ReMixIt! から最初のコンテクストを作成してください。</p>';
      count.textContent = '0 件';
      return;
    }
    count.textContent = `公開中 ${S.all().length} 件 ／ 見出し ${items.length} 点`;

    /* 件数が少なくても画面が埋まるよう、行ごとに並びを変えて必要数だけ繰り返す */
    const perRow = Math.max(8, Math.ceil(26 / Math.max(items.length,1)) * items.length);
    for (let r = 0; r < ROWS; r++){
      const row = document.createElement('div');
      row.className = 'row';
      row.style.animation = `${r%2===0?'driftL':'driftR'} ${72 + (r%5)*16}s linear infinite`;
      const half = document.createDocumentFragment();
      let bag = [];
      for (let i = 0; i < perRow; i++){
        if (!bag.length) bag = shuffle(items.slice());
        half.appendChild(makeTag(bag.pop(), i, r));
      }
      row.appendChild(half.cloneNode(true));
      row.appendChild(half);
      cloud.appendChild(row);
    }
  }

  cloud.addEventListener('click', e => {
    const t = e.target.closest('.tag');
    if (!t) return;
    toast(t.textContent.replace(/^#/,'') + ' へ');
    setTimeout(() => { location.href = t.dataset.href; }, 420);
  });

  const hold = on => cloud.querySelectorAll('.row').forEach(r => r.classList.toggle('paused', on));
  cloud.addEventListener('pointerenter', () => hold(true));
  cloud.addEventListener('pointerleave', () => hold(false));

  document.getElementById('reshuffle').addEventListener('click', () => { render(); toast('見出しを入れ替えました'); });

  /* ---------- メニュー ---------- */
  const sheet = document.getElementById('sheet');
  const list  = document.getElementById('list');

  function renderList(){
    list.textContent = '';
    const all = S.all();
    if (!all.length){
      const li = document.createElement('li');
      li.innerHTML = '<button type="button" disabled>まだありません</button>';
      list.appendChild(li);
      return;
    }
    all.forEach(e => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.appendChild(document.createTextNode(e.context.routeName || '(無題)'));
      const s = document.createElement('small');
      s.textContent = `${e.a.title || '?'} ↔ ${e.b.title || '?'}`;
      b.appendChild(s);
      b.addEventListener('click', () => {
        location.href = 'page.html?context=' + encodeURIComponent(e.context.slug);
      });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  document.querySelector('.menu').addEventListener('click', () => {
    renderList();
    sheet.classList.add('open');
  });
  document.getElementById('close').addEventListener('click', () => sheet.classList.remove('open'));

  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('作成したコンテクストをすべて削除し、初期データに戻します。よろしいですか？')) return;
    S.reset();
    sheet.classList.remove('open');
    render();
    toast('初期データに戻しました');
  });

  render();
})();
</script>
</body>
</html>
