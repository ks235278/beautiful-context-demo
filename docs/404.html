<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061629">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜Beautiful Context</title>
<!-- 構成図 9.4。存在しないアドレスでも地色の画面で迎え、
     アプリの中の「見つかりません」へ渡す。どの深さで開かれても戻れるよう、
     サイトの根を URL から割り出す。 -->
<script>
  (() => {
    const parts = location.pathname.split('/').filter(Boolean);
    const base = parts[0] === 'beautiful-context-demo' ? '/beautiful-context-demo/' : '/';
    const rest = base === '/' ? parts : parts.slice(1);
    /* 作品・区間・編集者のアドレス（c/…/ など）で、まだ静的なページがないもの（この端末で作ったつながりなど）は、
       アプリの中のそのページへ渡す */
    const to = rest.length >= 2 && /^(c|w|e)$/.test(rest[0]) ? `#/${rest[0]}/${rest[1]}${location.search}` : '#/404';
    location.replace(base + 'index.html' + to);
  })();
</script>
<style>html,body{margin:0;height:100%;background:#061629;color:#e9e4d8;font:14px/1.8 sans-serif}
a{color:inherit}p{padding:40px 24px;text-align:center}</style>
</head>
<body>
<noscript><p>ページが見つかりません。<br><a href="/beautiful-context-demo/">Beautiful Context へ</a></p></noscript>
</body>
</html>
