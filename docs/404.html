<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141c25">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜Beautiful Context</title>
<!-- 構成図 9.4。存在しないアドレスでも地色の画面で迎え、
     アプリの中の「見つかりません」へ渡す。どの深さで開かれても戻れるよう、
     サイトの根を URL から割り出す。 -->
<script>
  (() => {
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const base = seg === 'beautiful-context-demo' ? '/beautiful-context-demo/' : '/';
    location.replace(base + 'index.html#/404');
  })();
</script>
<style>html,body{margin:0;height:100%;background:#141c25;color:#e9e4d8;font:14px/1.8 sans-serif}
a{color:inherit}p{padding:40px 24px;text-align:center}</style>
</head>
<body>
<noscript><p>ページが見つかりません。<br><a href="/beautiful-context-demo/">Beautiful Context へ</a></p></noscript>
</body>
</html>
