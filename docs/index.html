<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Beautiful Context 起動画面。タップして UniverseIt! へ進みます。">
<title>Beautiful Context｜起動画面</title>
<style>
  :root{--ink:#121212;--paper:#f7f4ed;--gold:#a97717;--pcb:#2f6fb5;--charcoal:#10141a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e6df;
       font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  .stage{width:100%;max-width:1100px;padding:32px 20px 48px;text-align:center}
  .lead{margin:0 0 6px;font-size:13px;letter-spacing:.16em;color:var(--gold);font-weight:700}
  .sub{margin:0 0 28px;font-size:12px;color:#6b6a65;letter-spacing:.06em}
  .phone{position:relative;width:300px;height:620px;margin:0 auto;border-radius:44px;
         background:#0b0d10;padding:11px;box-shadow:0 26px 70px rgba(16,20,26,.34)}
  .screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;
          background:var(--charcoal);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .pcb{position:absolute;inset:0;opacity:.5}
  .status{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
          justify-content:space-between;padding:0 24px;color:#fff;font-size:13px;font-weight:600;z-index:3}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:28px;
          border-radius:16px;background:#000;z-index:4}
  .bars{display:flex;gap:3px;align-items:flex-end}
  .bars i{display:block;width:3px;background:#fff;border-radius:1px}
  .wordmark{position:relative;z-index:2;color:#fff;font-size:21px;font-weight:700;
            letter-spacing:.3em;text-indent:.3em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .tap{position:absolute;left:0;right:0;bottom:64px;z-index:2;color:#cfd6e0;font-size:12px;
       letter-spacing:.14em;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:120px;height:5px;
        border-radius:3px;background:#fff;opacity:.85;z-index:3}
  .note{margin:26px auto 0;max-width:460px;font-size:12px;line-height:1.9;color:#6b6a65}
  .note b{color:var(--ink);font-weight:600}
  @media (prefers-reduced-motion:reduce){.tap{animation:none;opacity:.8}}
</style>
</head>
<body>
<main class="stage">
  <p class="lead">BEAUTIFUL CONTEXT</p>
  <p class="sub">起動画面 ／ 画面をタップして進みます</p>

  <div class="phone">
    <div class="island"></div>
    <a class="screen" href="universe.html" aria-label="UniverseIt! へ進む">
      <svg class="pcb" viewBox="0 0 300 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="trace" width="75" height="75" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#2f6fb5" stroke-width="1.4" stroke-linecap="round">
              <path d="M0 18 H30 L44 32 H75"/>
              <path d="M0 56 H18 L30 44 V8"/>
              <path d="M56 0 V26 L68 38 V75"/>
              <path d="M8 75 V60 L22 46 H50"/>
              <path d="M75 62 H60 L50 52"/>
            </g>
            <g fill="#2f6fb5">
              <circle cx="30" cy="30" r="2.6"/><circle cx="56" cy="26" r="2.2"/>
              <circle cx="18" cy="56" r="2.2"/><circle cx="50" cy="46" r="2.4"/>
              <rect x="60" y="6" width="9" height="9" rx="1.6"/>
              <rect x="6" y="34" width="7" height="7" rx="1.4"/>
            </g>
          </pattern>
        </defs>
        <rect width="300" height="620" fill="#10141a"/>
        <rect width="300" height="620" fill="url(#trace)"/>
      </svg>

      <div class="status">
        <span>9:41</span>
        <span class="bars"><i style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><i style="height:14px"></i></span>
      </div>

      <div class="wordmark">BEAUTIFUL CONTEXT</div>
      <div class="tap">TAP TO START</div>
      <div class="home"></div>
    </a>
  </div>

  <p class="note">
    <b>1 / 4</b>　起動画面 → UniverseIt! → 作品・コンテクストページ → エディター
  </p>
</main>
</body>
</html>
