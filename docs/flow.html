<script>
if (location.hostname === 'beautifulcontext.com'){
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };

<body>

<!-- パソコンでは、地球の上に縦の舞台を一つ置く -->
<div class="earth" aria-hidden="true"></div>
<a class="pc-logo" href="index.html" aria-label="BEAUTIFUL CONTEXT（TOP へ）"><img src="img/logo.png" alt=""></a>

<div class="stage" id="stage">
  <header class="top">
    <a class="wm" href="index.html" aria-label="BEAUTIFUL CONTEXT（TOP へ）"><img src="img/logo.png" alt=""></a>
    <span class="pos" id="pos" aria-live="polite"></span>
  </header>

  <!-- 一画面に一つのつながり。上へ払うと次へ（scroll-snap。指の勢いも、途中で止めるのもブラウザそのもの） -->
  <main class="flow" id="flow" aria-label="つながりの流れ"></main>

  <!-- 右の細い列：フォロー・共感・共有・一覧 -->
  <aside class="rail" id="rail" aria-label="このつながりへの操作"></aside>

  <p class="hint" id="hint" aria-hidden="true">上へ払うと、次のつながり</p>

  <!-- 「読む」：本文が紙の幕として下から上がる。流れからは離れない -->
  <div class="sheet" id="sheet">
    <div class="veil" data-close></div>
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-label="コンテクスト・ストーリー">
      <div class="grab" aria-hidden="true"><i></i></div>
      <button type="button" class="x" data-close aria-label="閉じる">×</button>
      <div class="body" id="sheetBody"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<p class="pc-keys" aria-hidden="true">↑ ↓ で、前後のつながり</p>
