<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141c25">
<meta name="robots" content="noindex">
<title>Beautiful Context</title>
<!-- 以前の作品ページ（page.html?work=…／?context=…）。
     いまは index.html の中で、駅も裏面も同じ画面に重ねて開くので、そちらへ送る。
     共有済みのリンクを切らさないために残している。 -->
<script>
  (() => {
    const q = new URLSearchParams(location.search);
    const w = q.get('work'), c = q.get('context');
    const to = 'index.html' + (c ? '#/c/' + encodeURIComponent(c) : w ? '#/w/' + encodeURIComponent(w) : '');
    location.replace(to);
  })();
</script>
<style>html,body{margin:0;height:100%;background:#141c25;color:#e9e4d8;font:14px/1.8 sans-serif}
a{color:inherit}p{padding:40px 24px;text-align:center}</style>
</head>
<body>
<noscript><p><a href="index.html">Beautiful Context のストリームへ</a></p></noscript>
</body>
</html>
